# docker-compose.service.yml -- the evaluation service (design §5).
#
# THREE COMPOSE FILES, NEVER MERGED. The testbed's own compose is the system
# under evaluation; docker-compose.agent-obs.yml is the agent's trace viewer,
# kept out of the testbed so it cannot appear in the evidence packs the agent is
# later asked to diagnose; this one is the service. `name:` below pins a distinct
# project so no `docker compose down` in one of them can reach into another's
# containers, networks or volumes.
#
# up:     docker compose -f docker-compose.service.yml up -d --build
# health: curl -s localhost:8000/healthz
# down:   docker compose -f docker-compose.service.yml down
name: rca-service

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rca
      POSTGRES_USER: rca
      # Password by secret file, never by POSTGRES_PASSWORD: an environment
      # variable is visible in `docker inspect` and `docker compose config`.
      POSTGRES_PASSWORD_FILE: /run/secrets/pg
    secrets:
      - pg
    volumes:
      - rca_pg:/var/lib/postgresql/data
    # No `ports:` at all. Only api needs this database, and api reaches it over
    # the compose network. Publishing 5432 would put a database on the VM's
    # interfaces to save nothing.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./service
    depends_on:
      db:
        condition: service_healthy
    # Must match the host owner of ./artifacts/agent_runs -- the JSON evidence
    # artefacts are written through that bind mount from step 3 on, and a
    # root-written artefact in a repo the host user has to commit is a papercut
    # every single time.
    user: "${RCA_UID:-1001}:${RCA_GID:-1002}"
    environment:
      # From the VM shell (~/.bashrc), not from a file in the repo and not from a
      # build arg: it must not enter the image (§5).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RCA_DAILY_BUDGET_USD: "5.00"
      # /admin/* exists only while this is truthy. Second layer behind the
      # loopback-only port, not a replacement for it: the port binding can be
      # undone by a proxy or an edited compose file, this travels with the image.
      RCA_ADMIN_ENABLED: "1"
      # No password here on purpose; app/config.py splices in the secret file.
      RCA_DB_URL: postgresql://rca@db/rca
      RCA_PG_PASSWORD_FILE: /run/secrets/pg
    secrets:
      - pg
    volumes:
      # The evaluator itself, read-only. Mounted rather than COPYed into the
      # image on purpose (design §5 lists three mounts; this is a fourth): a
      # build-time copy would be a SECOND version of the judge, free to drift
      # from the one the CLI runs, and §4 requires the service and the CLI to
      # produce digit-for-digit the same numbers. :ro makes "服务只 import、
      # 不改" a filesystem property instead of a promise.
      - ./scripts:/repo/scripts:ro
      - ./evidence:/repo/evidence:ro                        # frozen packs, read-only
      - ./scenarios:/repo/scenarios:ro                       # ground truth, read-only, grading reads it
      - ./artifacts/agent_runs:/repo/artifacts/agent_runs    # JSON evidence artefacts are written
    ports:
      # Loopback only (决策 037, item 1). Demos go through `ssh -L 8000:localhost:8000`.
      # Every POST /runs is a billed model call, so a public port plus automatic
      # billing has no upper bound on what one leaked token costs; the $5 daily
      # budget is the last line of defence, not the first.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The queue consumer. Same image, same mounts, same environment as api -- it
  # runs the same code against the same evidence -- but its own process, because
  # a run that lives inside the web process dies with every restart (§4). One
  # replica, and that IS the concurrency limit: it makes "the most this can spend
  # in an hour" arithmetic rather than a guess.
  worker:
    build: ./service
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
    user: "${RCA_UID:-1001}:${RCA_GID:-1002}"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RCA_DAILY_BUDGET_USD: "5.00"
      RCA_DB_URL: postgresql://rca@db/rca
      RCA_PG_PASSWORD_FILE: /run/secrets/pg
      # A `running` row older than this is a run whose worker died. 600s is above
      # the p95 of the slowest arm (agent-haiku, 93 s measured) with room to spare;
      # too low and a live run gets requeued and charged twice.
      RCA_RUN_TIMEOUT_S: "600"
    secrets:
      - pg
    volumes:
      - ./scripts:/repo/scripts:ro
      - ./evidence:/repo/evidence:ro
      - ./scenarios:/repo/scenarios:ro
      - ./artifacts/agent_runs:/repo/artifacts/agent_runs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  pg:
    file: ./secrets/pg_password

volumes:
  rca_pg: {}
