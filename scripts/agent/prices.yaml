# Anthropic list prices, USD per million tokens.
#
# Fetched from the official pricing page, not from any cached table: the agent
# harness reports dollar figures and a stale rate silently misstates every one of
# them. Re-fetch and bump `fetched_at` before quoting costs in a new report.
source_url: https://platform.claude.com/docs/en/about-claude/pricing
fetched_at: "2026-08-28"
currency: USD
unit: per_million_tokens

# Cache columns are the pricing-page multipliers off base input (5m write 1.25x,
# 1h write 2x, read 0.1x), written out so the cost code never multiplies by hand.
models:
  claude-sonnet-5:
    input: 2.0
    output: 10.0
    cache_write_5m: 2.5
    cache_write_1h: 4.0
    cache_read: 0.2
  claude-haiku-4-5:
    input: 1.0
    output: 5.0
    cache_write_5m: 1.25
    cache_write_1h: 2.0
    cache_read: 0.1
